<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>neXsv - Negocios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth}
:root{--primary:#1657B8;--secondary:#19C2C6;--accent:#F7C531;--success:#74D67F;--bg:#F5F7FB;--text:#1D2A3A}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.hero{background:linear-gradient(rgba(9,28,61,.78),rgba(9,28,61,.82)),url('cover-negocios.jpg') center/cover no-repeat;height:340px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:450px;height:430px;background:rgba(25,194,198,.18);filter:blur(120px);border-radius:50%;top:-120px;right:-100px}.hero::after{content:"";position:absolute;width:320px;height:320px;background:rgba(247,197,49,.12);filter:blur(110px);border-radius:50%;bottom:-100px;left:-70px}.hero-content{position:relative;z-index:2;max-width:800px;padding:20px}.hero h1{font-size:60px;font-weight:800;line-height:1.05;letter-spacing:-2px;color:white;margin-bottom:18px}.hero p{font-size:20px;line-height:1.8;color:rgba(255,255,255,.9)}
.main{max-width:1300px;margin:auto;padding:70px 20px}.search-box{margin-bottom:40px}.search-box input{width:100%;padding:20px 24px;border:none;outline:none;border-radius:22px;background:rgba(255,255,255,.9);font-size:16px;font-family:'Inter',sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.06)}.search-box input:focus{box-shadow:0 0 0 4px rgba(25,194,198,.15)}
.categorias{display:flex;flex-wrap:wrap;gap:14px;margin-top:22px;margin-bottom:8px}.categorias-secundarias{display:none;margin-top:14px}.categorias-secundarias.mostrar{display:flex}.categoria-btn{border:2px solid transparent;cursor:pointer;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.82);font-family:'Inter',sans-serif;font-weight:700;color:var(--primary);transition:.25s;box-shadow:0 8px 20px rgba(0,0,0,.05)}.categoria-btn:hover{background:linear-gradient(135deg,var(--secondary),var(--primary));color:white;transform:translateY(-2px)}.categoria-btn.activo{background:#fff;color:var(--primary);border-color:rgba(22,87,184,.16);box-shadow:0 4px 12px rgba(22,87,184,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;align-items:stretch}.card{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-radius:24px;overflow:hidden;position:relative;transition:.35s;box-shadow:0 12px 35px rgba(0,0,0,.07);display:flex;flex-direction:column;height:430px}.card:hover{transform:translateY(-10px);box-shadow:0 24px 55px rgba(0,0,0,.12)}.logo-frame{width:100%;height:170px;flex:0 0 170px;display:flex;justify-content:center;align-items:center;padding:18px;position:relative}.card img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;object-position:center}.featured-badge{position:absolute;top:16px;right:16px;background:linear-gradient(135deg,#F7C531,#FFD95E);color:#1D2A3A;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:0 10px 20px rgba(247,197,49,.35)}
.card-content{padding:18px;display:flex;flex-direction:column;flex:1;min-height:0}.business-category{display:inline-flex;align-self:flex-start;margin-bottom:10px;padding:6px 12px;border-radius:999px;background:#eef3ff;color:var(--primary);font-size:12px;font-weight:700}.card h3{font-size:22px;font-weight:800;margin-bottom:10px;color:var(--primary);min-height:52px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card p{font-size:14px;line-height:1.65;color:#5d6677;min-height:0;max-height:48px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.verified-badge{display:inline-flex;align-items:center;margin-bottom:12px;padding:6px 12px;border-radius:999px;background:rgba(116,214,127,.15);color:#2e7d32;font-size:12px;font-weight:700}.description-toggle{display:inline-flex;align-self:flex-start;margin-top:4px;padding:0;border:0;background:transparent;color:var(--primary);font:700 12px 'Inter',sans-serif;cursor:pointer}.description-toggle:hover{text-decoration:underline}.card.description-expanded p{max-height:none;display:block;-webkit-line-clamp:unset;overflow:visible}.card.description-expanded{height:auto;min-height:430px}.business-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap;padding-top:12px}.btn{flex:1;text-align:center;padding:11px;border:none;border-radius:14px;text-decoration:none;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:.3s}.btn:hover{transform:translateY(-3px)}.btn-w{background:linear-gradient(135deg,var(--success),#5acb68);color:white}.btn-v{background:linear-gradient(135deg,var(--secondary),var(--primary));color:white}.btn-share{background:linear-gradient(135deg,#F7C531,#ffd95e);color:#1D2A3A}.btn-map{display:block;width:100%;margin-top:10px;padding:10px;text-align:center;border-radius:14px;border:0;font-weight:700;background:#eef3ff;color:var(--primary);cursor:pointer}.btn-map:hover{background:var(--primary);color:white}.business-logo-fallback{display:none!important}.directory-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;padding:32px;border:1px solid #e3e8f0;border-radius:22px;background:#fff;text-align:center;color:#64748B}.directory-empty strong{color:#233A72;font-size:16px}.directory-empty span{font-size:14px}.card[hidden]{display:none!important}
footer{margin-top:70px;background:white;padding:40px 20px;text-align:center;color:#6b7280;font-size:14px}.footer-line{width:100%;height:1px;background:#e5e7eb;margin-bottom:20px}@media(max-width:768px){.hero{height:300px}.hero h1{font-size:40px}.hero p{font-size:17px}.main{padding:45px 16px}.grid{grid-template-columns:1fr}.logo-frame{height:170px;flex-basis:170px}.categoria-btn{padding:10px 16px;font-size:13px}}
</style>
</head>
<body>
<script src="components/header.js"></script>
<section class="hero"><div class="hero-content"><h1>Explora negocios dentro de tu comunidad</h1><p>Conecta con emprendedores, servicios y marcas que forman parte de la red privada neXsv.</p></div></section>
<section class="main">
<div class="search-box">
<input type="search" id="buscador" placeholder="Buscar negocio..." autocomplete="off">
<div class="categorias" id="categoriasPrincipales">
<button type="button" class="categoria-btn activo" data-category="Todos">Todos</button>
<button type="button" class="categoria-btn" data-category="Hogar">🏠 Hogar</button>
<button type="button" class="categoria-btn" data-category="Hijos">👨‍👧 Hijos</button>
<button type="button" class="categoria-btn" data-category="Salud">❤️ Salud</button>
<button type="button" class="categoria-btn" data-category="Profesionales">⚖️ Profesionales</button>
<button type="button" class="categoria-btn" id="btnMasCategorias">➕ Más categorías</button>
</div>
<div class="categorias categorias-secundarias" id="masCategorias">
<button type="button" class="categoria-btn" data-category="Automotriz">🚗 Automotriz</button>
<button type="button" class="categoria-btn" data-category="Educación">🎓 Educación</button>
<button type="button" class="categoria-btn" data-category="Restaurantes">🍽 Restaurantes</button>
<button type="button" class="categoria-btn" data-category="Tecnología">💻 Tecnología</button>
<button type="button" class="categoria-btn" data-category="Compras">🛍 Compras</button>
<button type="button" class="categoria-btn" data-category="Viajes">✈️ Viajes</button>
<button type="button" class="categoria-btn" data-category="Otros">📦 Otros</button>
</div>
</div>
<div id="contenedor" class="grid"></div>
</section>
<footer><div class="footer-line"></div>© neXsv · Red Privada de Oportunidades</footer>
<script type="module" src="js/pages/business-directory-v2.js?v=20260921-2"></script>
</body>
</html>
