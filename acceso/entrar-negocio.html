<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Entrar como negocio | neXsv</title>

    <!-- Estilos compartidos -->
    <link rel="stylesheet" href="../css/auth-layout.css">

    <!-- Estilos específicos -->
    <link rel="stylesheet" href="../css/acceso.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<main class="access-page">

    <!-- Volver -->

    <a href="login-negocio.html" class="back-link">

        <i class="fa-solid fa-arrow-left"></i>

        Volver

    </a>


    <!-- Logo -->

    <a href="../index.html">

        <img src="../logo.png"
             alt="neXsv"
             class="logo">

    </a>


    <!-- Encabezado -->

    <section class="hero">

        <h1>

            Accede a tu negocio

        </h1>

        <p>

            Ingresa para administrar la presencia de tu negocio dentro de la red neXsv.

        </p>

    </section>


    <!-- Formulario -->

    <section class="auth-card">

        <form id="loginForm">

            <!-- Correo -->

            <div class="form-group">

                <label for="email">

                    Correo electrónico

                </label>

                <div class="input-group">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="correo@ejemplo.com"
                        required>

                </div>

            </div>


            <!-- Contraseña -->

            <div class="form-group">

                <label for="password">

                    Contraseña

                </label>

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Mostrar contraseña">

                        <i
                            id="togglePasswordIcon"
                            class="fa-regular fa-eye">
                        </i>

                    </button>

                </div>

            </div>


            <!-- Mensajes -->

            <div id="loginMessage"></div>


            <!-- Botón -->

            <button
                id="loginButton"
                class="primary-btn"
                type="submit">

                Entrar

            </button>

        </form>


        <!-- Enlaces -->

        <div class="auth-links">

            <a href="recuperar.html">

                ¿Olvidaste tu contraseña?

            </a>

        </div>

    </section>


    <!-- Footer -->

    <footer class="auth-footer">

        Administración de negocios • Relaciones de confianza

    </footer>

</main>


<!-- Nueva arquitectura neXsv -->

<script type="module" src="../js/app.js"></script>

<script type="module" src="../js/pages/login-negocio.js"></script>


</body>

</html>
