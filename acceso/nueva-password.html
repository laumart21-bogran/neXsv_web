<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva contraseña | neXsv</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/auth-layout.css">
    <link rel="stylesheet" href="../css/acceso.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<main class="access-page">

    <a href="validar-codigo.html" class="back-link">

        <i class="fa-solid fa-arrow-left"></i>

        Volver

    </a>

    <a href="../index.html">

        <img
            src="../logo.png"
            alt="neXsv"
            class="logo">

    </a>

    <section class="hero">

        <h1>

            Crea una nueva contraseña

        </h1>

        <p>

            Tu identidad ha sido verificada.
            Ingresa una contraseña nueva para continuar.

        </p>

    </section>

    <section class="auth-card">

        <form id="resetPasswordForm">

            <!-- Nueva contraseña -->

            <div class="form-group">

                <label for="password">

                    Nueva contraseña

                </label>

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        id="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Mínimo 8 caracteres"
                        required>

                </div>

            </div>

            <!-- Confirmar -->

            <div class="form-group">

                <label for="confirmPassword">

                    Confirmar contraseña

                </label>

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        id="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Repite la contraseña"
                        required>

                </div>

            </div>

            <div id="resetMessage"></div>

            <button
                id="resetButton"
                class="primary-btn"
                type="submit">

                Actualizar contraseña

            </button>

        </form>

    </section>

    <footer class="auth-footer">

        Tu seguridad es nuestra prioridad.

    </footer>

</main>

<script src="../js/config.js"></script>
<script type="module" src="../js/pages/reset-password.js"></script>

</body>

</html>
