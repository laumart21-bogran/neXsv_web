<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Incorporar mi negocio | neXsv</title>

    <link rel="stylesheet" href="css/styles.css">

</head>


<body>

    <main>

        <section>

            <h1>Incorporar mi negocio</h1>

            <p>
                Forma parte de la red privada de oportunidades neXsv.
            </p>


            <form id="businessForm">

                <div>
                    <label for="nombre">
                        Nombre del negocio
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >
                </div>


                <div>
                    <label for="categoria">
                        Categoría
                    </label>

                    <input
                        type="text"
                        id="categoria"
                        name="categoria"
                        required
                    >
                </div>


                <div>
                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        required
                    ></textarea>
                </div>


                <div>
                    <label for="telefono">
                        Teléfono / WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        required
                    >
                </div>


                <div>
                    <label for="email">
                        Correo del negocio
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>


                <div>
                    <label for="sitio_web">
                        Sitio web
                    </label>

                    <input
                        type="url"
                        id="sitio_web"
                        name="sitio_web"
                    >
                </div>


                <div>
                    <label for="direccion">
                        Dirección
                    </label>

                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        required
                    >
                </div>


                <div>
                    <label for="ciudad">
                        Ciudad
                    </label>

                    <input
                        type="text"
                        id="ciudad"
                        name="ciudad"
                        required
                    >
                </div>


                <button type="submit">
                    Enviar solicitud
                </button>

            </form>


            <div id="formMessage"></div>

        </section>

    </main>


    <script type="module" src="js/pages/incorporar-negocio.js"></script>

</body>

</html>
