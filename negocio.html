<style>

.container{max-width:1240px;margin:auto;padding:30px 22px 70px}.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--nx-blue);font-size:13px;font-weight:800;margin-bottom:18px}
.business-owner-bar{display:none;margin-bottom:18px;background:#fff;border:1px solid var(--nx-line);border-radius:20px;padding:10px;box-shadow:0 8px 24px rgba(29,42,58,.05);align-items:center;justify-content:space-between;gap:12px}.business-owner-bar.visible{display:flex}.business-owner-context{display:flex;align-items:center;gap:9px;color:var(--nx-blue);font-size:13px;font-weight:800;padding-left:8px}.business-owner-context i{color:#35A95C}.business-owner-actions{display:flex;gap:8px}.owner-mode-btn{border:1px solid transparent;border-radius:13px;padding:11px 16px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.2s}.owner-mode-public{background:#F3F7FE;color:var(--nx-blue);border-color:#E4ECFA}.owner-mode-manage{background:linear-gradient(135deg,var(--nx-blue),var(--nx-cyan));color:#fff}.owner-mode-btn:hover{transform:translateY(-1px)}

.galeria{position:relative;height:330px;margin-bottom:20px;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.06);border:1px solid var(--nx-line)}.galeria-track{display:flex;width:100%;height:100%;transition:transform .65s ease}.galeria-item{min-width:100%;height:330px;background:#fff;overflow:hidden}.galeria-item img{width:100%;height:100%;object-fit:cover;display:block}.galeria-controls{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:7px;z-index:2}.galeria-dot{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.72);box-shadow:0 1px 5px rgba(0,0,0,.18);cursor:pointer}.galeria-dot.active{width:22px;border-radius:999px;background:#fff}.galeria-empty{width:100%;display:flex;align-items:center;justify-content:center;color:#7b8494;font-weight:700}

<style>

@media(max-width:650px){.business-module-card{padding:22px}.module-form-grid,.presentation-slots{grid-template-columns:1fr}.presentation-module-slot.primary{grid-column:auto}.presentation-module-preview{grid-template-columns:1fr}.module-actions{flex-wrap:wrap}.module-message{width:100%;order:3}.module-btn{flex:1}}
</style><style>

<body>
<header><a href="negocios.html"><img src="logo.png" alt="neXsv"></a><div class="header-context">Espacio de negocio</div></header>
<div class="container">
<a class="back-link" href="negocios.html"><i class="fa-solid fa-arrow-left"></i> Volver a negocios</a>
<div id="businessOwnerBar" class="business-owner-bar">
    <div class="business-owner-context"><i class="fa-solid fa-circle-check"></i><span>Estás gestionando este negocio</span></div>
    <div class="business-owner-actions">
        <button type="button" id="ownerPublicMode" class="owner-mode-btn owner-mode-public"><i class="fa-regular fa-eye"></i> Vista pública</button>
        <button type="button" id="ownerManageMode" class="owner-mode-btn owner-mode-manage"><i class="fa-solid fa-gear"></i> Gestionar negocio</button>
    </div>
</div>
<div id="businessSpace" class="business-space">
    <div id="contenido"><div class="loading">Cargando negocio...</div></div>
    <aside id="businessManagePanel" class="business-manage-panel">
        <div class="business-manage-head">
            <span class="business-manage-badge">Espacio del negocio</span>
            <h2>Gestionar negocio</h2>
            <p>Administra cómo se presenta tu negocio y cómo conectas con tu comunidad.</p>
        </div>
        <div class="business-manage-actions">
            <button type="button" class="business-manage-action publish-now" data-business-module="publish">
                <i class="fa-solid fa-bullhorn"></i>
                <span><strong>Publicar ahora</strong><small>Crea algo nuevo para tu comunidad.</small></span>
            </button>

            <div class="business-manage-section-label">Gestiona tu negocio</div>
            <button type="button" class="business-manage-action" data-business-module="information">
                <i class="fa-solid fa-store"></i><span><strong>Información</strong><small>Datos principales de tu negocio.</small></span>
            </button>
            <button type="button" class="business-manage-action" data-business-module="presentation">
                <i class="fa-regular fa-images"></i><span><strong>Presentación</strong><small>Logotipo y fotografías públicas.</small></span>
            </button>
            <button type="button" class="business-manage-action">
                <i class="fa-solid fa-box-open"></i><span><strong>Servicios</strong><small>Gestiona lo que ofrece tu negocio.</small></span>
            </button>

            <div class="business-manage-section-label">Conecta con tu comunidad</div>
            <button type="button" class="business-manage-action" data-business-module="publications">
                <i class="fa-regular fa-newspaper"></i><span><strong>Publicaciones</strong><small>Administra noticias y novedades.</small></span>
            </button>
            <button type="button" class="business-manage-action">
                <i class="fa-solid fa-users"></i><span><strong>Comunidad</strong><small>Interacción y opiniones de miembros.</small></span>
            </button>

            <div class="business-manage-section-label">Consulta</div>
            <button type="button" class="business-manage-action">
                <i class="fa-solid fa-chart-line"></i><span><strong>Resultados</strong><small>Consulta el rendimiento de tu negocio.</small></span>
            </button>
        </div>
    </aside>
</div>
<div id="businessModuleOverlay" class="business-module-overlay" hidden>
  <section class="business-module-card" role="dialog" aria-modal="true" aria-labelledby="businessModuleTitle">
    <button type="button" id="businessModuleClose" class="business-module-close" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
    <div id="businessModuleContent"></div>
  </section>
</div>
<script type="module" src="js/pages/negocio.js?v=20260928-6"></script>
<script type="module" src="js/pages/business-space.js?v=20260928-2"></script>
</body>
</html>
