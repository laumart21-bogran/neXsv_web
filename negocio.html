<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#F5F7FB;color:#1D2A3A}header{padding:20px 40px;background:#fff;box-shadow:0 2px 15px rgba(0,0,0,.05);display:flex;justify-content:space-between;align-items:center}header img{height:70px}.container{max-width:1200px;margin:auto;padding:50px 20px 70px}.back-link{display:inline-flex;align-items:center;gap:8px;color:#1657B8;text-decoration:none;font-weight:700;margin-bottom:22px}.galeria{position:relative;height:320px;margin-bottom:40px;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08)}.galeria-track{display:flex;width:100%;height:100%;transition:transform .65s ease}.galeria-item{min-width:100%;height:320px;background:#fff;overflow:hidden}.galeria-item img{width:100%;height:100%;object-fit:cover;display:block}.galeria-controls{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:7px;z-index:2}.galeria-dot{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 1px 5px rgba(0,0,0,.18);cursor:pointer}.galeria-dot.active{width:22px;border-radius:999px;background:#fff}.galeria-empty{width:100%;display:flex;align-items:center;justify-content:center;color:#7b8494;font-weight:700}.info{background:#fff;padding:40px;border-radius:28px;box-shadow:0 12px 35px rgba(0,0,0,.06)}.identity{display:flex;gap:22px;align-items:flex-start;margin-bottom:24px}.logo-box{width:120px;height:120px;flex:0 0 120px;border-radius:24px;background:#EEF3FF;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#1657B8;font-size:38px}.logo-box img{width:100%;height:100%;object-fit:contain;padding:12px}.badge{display:inline-block;background:#EAF2FF;color:#1657B8;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;margin-bottom:18px}.verified{display:inline-flex;align-items:center;gap:6px;background:#EAF8EF;color:#277642;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:800;margin:0 0 18px 8px}h1{font-size:48px;margin-bottom:20px;color:#1657B8}.descripcion{font-size:18px;line-height:1.9;color:#5d6677;margin-bottom:35px}.botones{display:flex;flex-wrap:wrap;gap:15px}.btn{padding:16px 24px;border-radius:16px;text-decoration:none;font-weight:700;transition:.3s;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;font-family:Inter;cursor:pointer}.btn:hover{transform:translateY(-3px)}.btn-whatsapp{background:linear-gradient(135deg,#74D67F,#56c76a);color:#fff}.btn-mapa{background:linear-gradient(135deg,#19C2C6,#1657B8);color:#fff}.btn-share{background:linear-gradient(135deg,#F7C531,#ffd95e);color:#1D2A3A}.review-summary{margin-top:30px;margin-bottom:35px;padding:24px;background:#F8FAFF;border-radius:24px}.review-score{font-size:34px;font-weight:800;color:#1657B8;margin-bottom:10px}.review-count{color:#5d6677;font-weight:700}.reviews-section{margin-top:50px}.reviews-section h2,.review-form h2{font-size:28px;margin-bottom:20px;color:#1657B8}.review-card{padding:18px;background:#F8FAFF;border-radius:18px;margin-top:16px}.review-name{font-weight:800;margin-bottom:8px;color:#1657B8}.review-comment{line-height:1.7;color:#5d6677}.review-empty{padding:20px;background:#F8FAFF;border-radius:18px;color:#5d6677;font-weight:600}.review-form{margin-top:40px;padding:30px;background:#F8FAFF;border-radius:24px}.review-form input,.review-form select,.review-form textarea{width:100%;padding:16px;border:none;border-radius:16px;margin-bottom:18px;font-family:Inter,sans-serif;font-size:15px;background:#fff}.review-form textarea{height:140px;resize:none}.review-form button{width:100%;padding:18px;border:none;border-radius:18px;font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#19C2C6,#1657B8);color:#fff}#mensajeReview{margin-top:18px;font-weight:700;color:#1657B8;text-align:center}.detail-footer{display:flex;gap:12px;margin-top:24px}.business-owner-bar{display:none;margin:0 0 22px;background:#fff;border:1px solid #E4EAF4;border-radius:22px;padding:14px 16px;box-shadow:0 8px 24px rgba(29,42,58,.06);align-items:center;justify-content:space-between;gap:16px}.business-owner-bar.visible{display:flex}.business-owner-context{display:flex;align-items:center;gap:10px;color:#1D2A3A;font-weight:800}.business-owner-context i{color:#19A77A}.business-owner-actions{display:flex;gap:10px}.owner-mode-btn{border:0;border-radius:14px;padding:12px 18px;font-family:Inter;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}.owner-mode-public{background:#F2F6FC;color:#1657B8}.owner-mode-manage{background:linear-gradient(135deg,#19C2C6,#1657B8);color:#fff}.business-manage-panel{display:none;background:#fff;border-radius:28px;box-shadow:0 12px 35px rgba(0,0,0,.06);padding:28px;margin-bottom:24px}.business-manage-panel.visible{display:block}.business-manage-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.business-manage-head h2{font-size:28px;color:#1657B8;margin-bottom:6px}.business-manage-head p{color:#687386}.business-manage-close{border:0;background:#F2F6FC;color:#1657B8;width:42px;height:42px;border-radius:14px;cursor:pointer}.business-manage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.business-manage-action{border:1px solid #E4EAF4;background:#F8FAFF;border-radius:20px;padding:20px;text-align:left;cursor:pointer;font-family:Inter;display:flex;gap:14px;align-items:center;transition:.2s}.business-manage-action:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(22,87,184,.08)}.business-manage-action.featured{background:linear-gradient(135deg,#19C2C6,#1657B8);color:#fff;border-color:transparent}.business-manage-action i{font-size:22px;width:28px;text-align:center}.business-manage-action strong{display:block;font-size:16px;margin-bottom:4px}.business-manage-action small{display:block;opacity:.75;font-size:12px}.loading{text-align:center;padding:100px 20px;font-size:22px;font-weight:700}@media(max-width:768px){.business-owner-bar{align-items:stretch;flex-direction:column}.business-owner-actions{width:100%}.owner-mode-btn{flex:1;justify-content:center}.business-manage-grid{grid-template-columns:1fr}.business-manage-head{margin-bottom:18px}header{padding:18px}header img{height:55px}.container{padding:28px 16px 50px}.galeria{grid-template-columns:1fr}.galeria-item{height:260px}.identity{flex-direction:column}.logo-box{width:105px;height:105px;flex-basis:105px}h1{font-size:34px}.descripcion{font-size:16px}.info{padding:25px}.badge{margin-bottom:10px}.verified{margin:0 0 12px 0}.botones{flex-direction:column}.btn{width:100%;text-align:center}.review-form{padding:22px}}
@media(max-width:700px){.galeria,.galeria-item{height:250px}}\n</style>
</head>
<body>
<header><a href="negocios.html"><img src="logo.png" alt="NeXsv"></a></header>
<div class="container">
<a class="back-link" href="negocios.html"><i class="fa-solid fa-arrow-left"></i> Volver a negocios</a>
<div id="businessOwnerBar" class="business-owner-bar">
    <div class="business-owner-context"><i class="fa-solid fa-circle-check"></i><span>Este es tu espacio de negocio</span></div>
    <div class="business-owner-actions">
        <button type="button" id="ownerPublicMode" class="owner-mode-btn owner-mode-public"><i class="fa-regular fa-eye"></i> Vista pública</button>
        <button type="button" id="ownerManageMode" class="owner-mode-btn owner-mode-manage"><i class="fa-solid fa-sliders"></i> Gestionar</button>
    </div>
</div>
<section id="businessManagePanel" class="business-manage-panel">
    <div class="business-manage-head">
        <div><span class="badge">Gestión del negocio</span><h2>Gestiona tu presencia en neXsv</h2><p>Las herramientas del propietario vivirán aquí, dentro del mismo espacio que ve tu comunidad.</p></div>
        <button type="button" id="closeOwnerManage" class="business-manage-close" aria-label="Volver a vista pública"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="business-manage-grid">
        <button type="button" class="business-manage-action"><i class="fa-solid fa-store"></i><span><strong>Información</strong><small>Edita los datos públicos de tu negocio.</small></span></button>
        <button type="button" class="business-manage-action"><i class="fa-regular fa-images"></i><span><strong>Presentación</strong><small>Logo y fotografías de presentación.</small></span></button>
        <button type="button" class="business-manage-action featured"><i class="fa-solid fa-plus"></i><span><strong>Publicar ahora</strong><small>Comparte algo nuevo con tu comunidad.</small></span></button>
        <button type="button" class="business-manage-action"><i class="fa-regular fa-newspaper"></i><span><strong>Publicaciones</strong><small>Administra lo que ya has publicado.</small></span></button>
        <button type="button" class="business-manage-action"><i class="fa-solid fa-users"></i><span><strong>Comunidad</strong><small>Interactúa con las personas de neXsv.</small></span></button>
        <button type="button" class="business-manage-action"><i class="fa-solid fa-chart-line"></i><span><strong>Resultados</strong><small>Consulta el rendimiento de tu negocio.</small></span></button>
    </div>
</section>
<div id="contenido"><div class="loading">Cargando negocio...</div></div>
</div>
<script type="module" src="js/pages/negocio.js?v=20260928-1"></script>
</body>
</html>
